[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqli-toolkit"
description = "Interactive walkthrough + payload builders + auto-mode for SQL injection practice."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Malina" }]
keywords = ["security", "sqli", "portswigger", "pentest", "training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dynamic = ["version"]
dependencies = [
    "requests>=2.28",
    "urllib3>=1.26",
]

[project.optional-dependencies]
rich = ["rich>=13.0"]
dev = ["pytest>=7.0", "pytest-cov", "rich>=13.0"]

[project.scripts]
sqli-toolkit = "sqli_toolkit.helper:main"

[tool.setuptools]
packages = [
    "sqli_toolkit",
    "sqli_toolkit.channels",
]

[tool.setuptools.dynamic]
version = { attr = "sqli_toolkit._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["sqli_toolkit/tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["sqli_toolkit"]
omit = ["sqli_toolkit/tests/*"]
